name: Bug report
description: Something in Tidy Nest doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mod version
      description: The number in the jar's name, e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer server that has Tidy Nest
        - Multiplayer server without Tidy Nest
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to make it happen again help a lot.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Game log or crash report
      description: Drag in `logs/latest.log` or the file from `crash-reports/`, if there is one.
